apply plugin: 'com.android.application'

android {
    namespace "com.flaggame.app"
    compileSdkVersion rootProject.ext.compileSdkVersion
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    // Add dependency resolution strategy to fix duplicate classes
    configurations.all {
        resolutionStrategy {
            force "androidx.activity:activity:${rootProject.ext.androidxActivityVersion}"
            force "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
            force "androidx.core:core:${rootProject.ext.androidxCoreVersion}"
        }
    }
    
    defaultConfig {
        applicationId "com.flaggame.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Disable baseline profiles to prevent INSTALL_BASELINE_PROFILE_FAILED error
        // manifestPlaceholders = [enableBaselineProfiles: "false"]
        
        // WebView optimizations
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    signingConfigs {
        release {
            storeFile file('flag-game-upload-key.keystore')
             storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'flaggame123'
            keyAlias 'flag-game-upload-key'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: 'flaggame123'
        }
    }
    
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    // Disable baseline profiles to fix INSTALL_BASELINE_PROFILE_FAILED error
    packagingOptions {
        resources {
            excludes += [
                "META-INF/com.android.tools/r8-from",
                "META-INF/com.android.tools/proguard-from",
                "META-INF/com.android.tools/r8-to",
                "META-INF/com.android.tools/proguard-to",
                "META-INF/com.android.tools/baseline-profiles"
            ]
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
